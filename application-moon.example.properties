# Use only your own LOCAL settings. No actual credentials belong in Git.
# ./gradlew bootRun --args='--spring.config.location=file:application-moon.example.properties'
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${PREEN_DB_URL}
spring.datasource.username=${PREEN_DB_USER}
spring.datasource.password=${PREEN_DB_PASSWORD}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
app.cors.allowed-origins=${PREEN_FRONTEND_ORIGIN:http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never
