# Use only your own LOCAL settings. No actual credentials belong in Git.
# ./gradlew bootRun --args='--spring.config.location=file:application-moon.example.properties'
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${PREEN_DB_URL}
spring.datasource.username=${PREEN_DB_USER}
spring.datasource.password=${PREEN_DB_PASSWORD}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
app.cors.allowed-origins=${PREEN_FRONTEND_ORIGIN:http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never

# Required by the team's signup configuration. Supply private random values locally.
app.auth.code-expiration=5m
app.auth.resend-interval=1m
app.auth.max-attempts=5
app.auth.signup-token-expiration=15m
app.auth.hash-secret=${PREEN_AUTH_HASH_SECRET}
app.auth.crypto.encryption-key=${PREEN_AUTH_ENCRYPTION_KEY}
app.auth.mail-from=${PREEN_MAIL_FROM:noreply@example.invalid}
spring.mail.host=${PREEN_MAIL_HOST:127.0.0.1}
spring.mail.port=${PREEN_MAIL_PORT:2525}
