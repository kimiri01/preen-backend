spring.application.name=preen_backend

# ===== MySQL 연결 =====
# ${이름:기본값} 형식입니다. 환경변수가 없으면 콜론(:) 뒤의 기본값을 씁니다.
# 비밀번호는 코드에 적지 않고 환경변수 DB_PASSWORD 로 넣어 주세요.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:preen}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA =====
# validate: 테이블 구조 변경은 Flyway 마이그레이션(resources/db/migration)으로만 합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== CORS =====
# 프론트엔드 개발 서버 주소. 여러 개면 쉼표로 구분합니다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Flyway =====
# 스키마 변경 SQL은 src/main/resources/db/migration 의 V<번호>__설명.sql 파일로 관리합니다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== .env 파일 =====
# 도커 컴포즈용 .env(DB_PASSWORD 등)를 앱이 함께 읽습니다. 파일이 없어도 시작은 됩니다.
spring.config.import=optional:file:./.env[.properties]



#=================Reservation 프로퍼티===================================
# ===== 예약 설정 =====
# 예약 생성 후 결제 대기 시간 (10m = 10분, 30s = 30초, 1h = 1시간 등 단위 지정 가능)
staybook.reservation.hold-duration=10m

#=========common.storage 프로퍼티 =================
storage.local-root-dir=${STORAGE_LOCAL_DIR:./uploads}
storage.base-url=${STORAGE_BASE_URL:http://localhost:8080}
storage.max-image-size=5MB


#===================common프로퍼티========================
staybook.crypto.encryption-key=${CRYPTO_ENCRYPTION_KEY}
staybook.crypto.hash-key=${CRYPTO_HASH_KEY}
# ===== 메일 (회원가입 이메일 인증) =====
# 네이버 SMTP를 사용합니다. 계정 정보는 .env 의 MAIL_USERNAME / MAIL_PASSWORD 로 넣어 주세요.
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== 회원가입·인증 (auth) =====
app.auth.code-expiration=5m
app.auth.resend-interval=60s
app.auth.max-attempts=5
app.auth.signup-token-expiration=15m
# 아래 두 값은 비밀값이라 .env 에 넣습니다. (.env.example 참고)
app.auth.hash-secret=${AUTH_HASH_SECRET}
app.auth.mail-from=${MAIL_USERNAME}
app.auth.crypto.encryption-key=${EMAIL_ENCRYPTION_KEY}



#==============RDS 연결 제한============
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000